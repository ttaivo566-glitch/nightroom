<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portrait Studio</title>
<style>
:root{--bg:#14161a;--p:#1e2127;--t:#e8eaed;--m:#9aa0a6;--a:#4f8cff;--b:#2c313a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;display:flex;height:100vh}
#sw{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;gap:8px;padding:8px;background:var(--p);flex-wrap:wrap;align-items:center}
button,select{background:var(--b);color:var(--t);border:1px solid #3a404a;border-radius:8px;padding:8px 12px;font:inherit}
button.pr{background:var(--a);border-color:var(--a)}button.on{outline:2px solid var(--a)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#wrap{position:relative;line-height:0;overflow:hidden;background:repeating-conic-gradient(#555 0 25%,#777 0 50%) 0 0/16px 16px}
#wrap canvas{position:absolute;inset:0;width:100%;height:100%}
#box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);display:none;cursor:move;touch-action:none}
#panel{width:340px;background:var(--p);overflow:auto;padding:8px}
details{border-bottom:1px solid var(--b);padding:6px 0}summary{font-weight:600;padding:6px 0;cursor:pointer}
label{display:block;margin:6px 0;color:var(--m);font-size:13px}
input[type=range]{width:100%}.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sw{width:30px;height:30px;padding:0;border-radius:50%}
#st{color:var(--m);font-size:12px;padding:4px 8px;min-height:20px}
@media(max-width:800px){body{display:block;height:auto}#sw{height:62vh}#panel{width:100%}}
</style></head><body>
<div id="sw">
 <div id="top">
  <button class="pr" onclick="f.click()">⬆ Tải ảnh lên</button>
  <button class="pr" onclick="dl()">⬇ Tải về</button>
  <select id="fmt"><option value="png">PNG</option><option value="jpg">JPG</option></select>
  <button onclick="undoM()">↶ Hoàn tác vùng</button>
  <input type="file" id="f" accept="image/*" hidden>
 </div>
 <div id="stage"><div id="wrap"><canvas id="cv"></canvas><canvas id="ov"></canvas><div id="box"></div></div></div>
 <div id="st">Hãy tải một ảnh chân dung lên.</div>
</div>
<div id="panel">
 <details open><summary>1. Công cụ / vùng chọn</summary>
  <div class="row" id="tools">
   <button data-t="move" class="on">✋ Di chuyển khung</button>
   <button data-t="keep">🖌 Tô giữ lại</button>
   <button data-t="erase">🧽 Tô xóa bỏ</button>
   <button data-t="lai">⭕ Khoanh → nhận dạng lại</button>
   <button data-t="lkeep">⭕ Khoanh → giữ</button>
   <button data-t="lerase">⭕ Khoanh → xóa</button>
  </div>
  <label>Cỡ cọ <input type="range" id="bs" min="5" max="120" value="30"></label>
  <button onclick="autoRemove()">🔁 Xóa nền tự động lại từ đầu</button>
 </details>
 <details open><summary>2. Nền mới</summary>
  <select id="bgt"><option value="none">Trong suốt</option><option value="color" selected>Màu đơn</option><option value="grad">Chuyển màu</option><option value="img">Ảnh nền</option><option value="blur">Làm mờ nền gốc</option></select>
  <div class="row"><input type="color" id="c1" value="#2f7bd8"><input type="color" id="c2" value="#ffffff">
   <button class="sw" data-c="#ffffff" style="background:#fff"></button><button class="sw" data-c="#2f7bd8" style="background:#2f7bd8"></button>
   <button class="sw" data-c="#d9d9d9" style="background:#d9d9d9"></button><button class="sw" data-c="#c8102e" style="background:#c8102e"></button></div>
  <button onclick="bgf.click()">Chọn ảnh nền…</button><input type="file" id="bgf" accept="image/*" hidden>
 </details>
 <details open><summary>3. Ánh sáng &amp; đèn studio</summary>
  <button onclick="auto()">✨ Tự cân chỉnh ảnh cũ</button>
  <div id="sl"></div>
  <button onclick="resetL()">Đặt lại ánh sáng</button>
 </details>
 <details open><summary>4. Tăng cường ảnh bằng AI</summary>
  <select id="um"><option value="s">Nhanh (ESRGAN slim 2x)</option><option value="m">Chất lượng (ESRGAN medium 2x)</option></select>
  <button onclick="up()">🚀 Tăng độ phân giải x2</button>
  <label>Chạy ngay trên trình duyệt, có thể mất vài phút. Nên dùng cho ảnh nhỏ (dưới ~1500px).</label>
 </details>
 <details open><summary>5. Tỉ lệ &amp; khung cắt</summary>
  <select id="rt"><option value="">Không cắt</option><option value="o">Giữ tỉ lệ gốc</option><option value="3/4">3×4</option><option value="4/6">4×6</option><option value="2/3">2×3</option><option value="1/1">1×1</option><option value="4/3">4×3</option><option value="16/9">16×9</option><option value="9/16">9×16</option></select>
  <label>Thu phóng khung <input type="range" id="zm" min="10" max="100" value="100"></label>
  <label>Kéo khung để di chuyển; cuộn chuột trên ảnh để thu phóng.</label>
 </details>
</div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d'),ov=$('#ov'),ox=ov.getContext('2d'),wrap=$('#wrap'),box=$('#box');
let W=0,H=0,src,mask,mx,bgImg=null,tool='move',undo=[],hasMask=false,litC=null,dirty=true,raf=0,BR=null;
const L={},D={br:0,ct:0,sh:0,hl:0,wm:0,sa:0,li:0,lx:50,ly:25,ls:60},crop={on:false,r:1,cx:0,cy:0,k:100};
const st=t=>$('#st').textContent=t,sleep=()=>new Promise(r=>setTimeout(r));
const S=[['br','Độ sáng',-100,100],['ct','Tương phản',-100,100],['sh','Nâng vùng tối',0,100],['hl','Giảm vùng cháy sáng',0,100],['wm','Ấm ↔ lạnh',-100,100],['sa','Màu sắc',-100,100],['li','Đèn studio: cường độ',0,100],['lx','Đèn: vị trí ngang',0,100],['ly','Đèn: vị trí dọc',0,100],['ls','Đèn: độ rộng',10,150]];
$('#sl').innerHTML=S.map(([k,n,a,b])=>`<label>${n}<input type="range" id="s_${k}" min="${a}" max="${b}" value="${D[k]}"></label>`).join('');
function resetL(){Object.assign(L,D);S.forEach(([k])=>$('#s_'+k).value=L[k]);dirty=true;sched()}resetL();
S.forEach(([k])=>$('#s_'+k).oninput=e=>{L[k]=+e.target.value;dirty=true;sched()});
function sched(){cancelAnimationFrame(raf);raf=requestAnimationFrame(render)}
['bgt','c1','c2'].forEach(i=>$('#'+i).oninput=sched);
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{$('#c1').value=b.dataset.c;if($('#bgt').value=='none')$('#bgt').value='color';sched()});
$('#bgf').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;bgImg=await createImageBitmap(fl);$('#bgt').value='img';sched()};
$('#f').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;
 const b=await createImageBitmap(fl),k=Math.min(1,2048/Math.max(b.width,b.height));
 W=Math.round(b.width*k);H=Math.round(b.height*k);src=mk(W,H);src.getContext('2d').drawImage(b,0,0,W,H);
 cv.width=ov.width=W;cv.height=ov.height=H;newMask(true);undo=[];crop.cx=W/2;crop.cy=H/2;crop.k=100;resetL();
 setRatio();fit();render();autoRemove()};
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function newMask(full){mask=mk(W,H);mx=mask.getContext('2d',{willReadFrequently:true});if(full){mx.fillStyle='#fff';mx.fillRect(0,0,W,H)}hasMask=false}
function fit(){if(!W)return;const s=$('#stage'),k=Math.min((s.clientWidth-16)/W,(s.clientHeight-16)/H);wrap.style.width=W*k+'px';wrap.style.height=H*k+'px';updBox()}
addEventListener('resize',fit);
async function getBR(){if(BR)return BR;st('Đang tải mô hình tách nền (lần đầu khá nặng, vui lòng chờ)…');
 for(const u of ['https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm','https://esm.sh/@imgly/background-removal@1.7.0'])
  try{BR=await import(u);return BR}catch(e){console.warn(e)}
 throw new Error('Không tải được mô hình tách nền')}
async function cutBlob(canvas){const m=await getBR(),b=await new Promise(r=>canvas.toBlob(r,'image/png'));
 const o=await m.removeBackground(b,{output:{format:'image/png'},progress:(k,c,t)=>st('Đang tách nền… '+(t?Math.round(c/t*100)+'%':''))});
 return createImageBitmap(o)}
async function autoRemove(){if(!src)return;try{const bm=await cutBlob(src);pushU();mx.clearRect(0,0,W,H);mx.drawImage(bm,0,0,W,H);hasMask=true;render();st('Xong. Nếu nhận dạng sai, hãy dùng ⭕ Khoanh → nhận dạng lại hoặc cọ.')}catch(e){st('Lỗi tách nền: '+e.message)}}
function lit(){const c=src.getContext('2d'),im=c.getImageData(0,0,W,H),d=im.data,{br,ct,sh,hl,wm,sa,li,lx,ly,ls}=L;
 const B=1+br/100,C=1+ct/100,Sa=1+sa/100,px=lx/100*W,py=ly/100*H,R=ls/100*Math.max(W,H),ln=li/100*.6,w=wm/250,sH=sh/200,hH=hl/200;
 const cl=v=>v<0?0:v>1?1:v;
 for(let i=0,p=0;i<d.length;i+=4,p++){let r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,l=.299*r+.587*g+.114*b;
  const lf=sH*(1-l)*(1-l)-hH*l*l;r=r*B+lf;g=g*B+lf;b=b*B+lf;
  if(ln>0){const dx=p%W-px,dy=((p/W)|0)-py;let f=1-Math.sqrt(dx*dx+dy*dy)/R;if(f>0){f=f*f*(3-2*f);const a=ln*f;r=1-(1-r)*(1-a);g=1-(1-g)*(1-a);b=1-(1-b)*(1-a)}}
  r=(r-.5)*C+.5+w;b=(b-.5)*C+.5-w;g=(g-.5)*C+.5;
  l=.299*r+.587*g+.114*b;r=l+(r-l)*Sa;g=l+(g-l)*Sa;b=l+(b-l)*Sa;
  d[i]=cl(r)*255;d[i+1]=cl(g)*255;d[i+2]=cl(b)*255}
 litC=mk(W,H);litC.getContext('2d').putImageData(im,0,0)}
function auto(){if(!src)return;const d=src.getContext('2d').getImageData(0,0,W,H).data,h=new Array(256).fill(0);let n=0,s=0;
 for(let i=0;i<d.length;i+=64){const l=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);h[l]++;n++;s+=l}
 const pc=q=>{let a=0;for(let i=0;i<256;i++){a+=h[i];if(a>=n*q)return i/255}return 1},lo=pc(.02),hi=pc(.98),m=s/n/255;
 const v=(k,x)=>{L[k]=Math.round(Math.max(-100,Math.min(100,x)));$('#s_'+k).value=L[k]};
 v('br',(.48/Math.max(m,.05)-1)*80);v('ct',((1/Math.max(hi-lo,.2))-1)*60);v('sh',m<.4?35:20);v('hl',hi>.97?25:0);dirty=true;sched();st('Đã tự cân chỉnh, bạn có thể tinh chỉnh thêm.')}
function render(){if(!src)return;if(dirty){lit();dirty=false}
 cx.clearRect(0,0,W,H);const t=$('#bgt').value;
 if(t=='color'){cx.fillStyle=$('#c1').value;cx.fillRect(0,0,W,H)}
 else if(t=='grad'){const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,$('#c1').value);g.addColorStop(1,$('#c2').value);cx.fillStyle=g;cx.fillRect(0,0,W,H)}
 else if(t=='img'&&bgImg){const k=Math.max(W/bgImg.width,H/bgImg.height),w=bgImg.width*k,h=bgImg.height*k;cx.drawImage(bgImg,(W-w)/2,(H-h)/2,w,h)}
 else if(t=='blur'){const a=mk(Math.ceil(W/30),Math.ceil(H/30)),ac=a.getContext('2d');ac.imageSmoothingQuality='high';ac.drawImage(src,0,0,a.width,a.height);cx.imageSmoothingQuality='high';cx.drawImage(a,0,0,W,H)}
 const p=mk(W,H),pc=p.getContext('2d');pc.drawImage(litC,0,0);if(hasMask){pc.globalCompositeOperation='destination-in';pc.drawImage(mask,0,0)}
 cx.drawImage(p,0,0)}
function pushU(){undo.push(mx.getImageData(0,0,W,H));if(undo.length>6)undo.shift()}
function undoM(){if(undo.length){mx.putImageData(undo.pop(),0,0);render()}}
document.querySelectorAll('#tools button').forEach(b=>b.onclick=()=>{tool=b.dataset.t;document.querySelectorAll('#tools button').forEach(x=>x.classList.toggle('on',x==b));
 ov.style.pointerEvents=tool=='move'?'none':'auto';ov.style.cursor='crosshair';box.style.pointerEvents=tool=='move'?'auto':'none'});
let drag=false,pts=[];
const pos=e=>{const r=ov.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
function stroke(a,b){mx.globalCompositeOperation=tool=='keep'?'source-over':'destination-out';mx.strokeStyle='#fff';mx.lineCap='round';
 mx.lineWidth=$('#bs').value*W/ov.getBoundingClientRect().width;mx.beginPath();mx.moveTo(...a);mx.lineTo(...b);mx.stroke();mx.globalCompositeOperation='source-over';hasMask=true}
ov.onpointerdown=e=>{if(tool=='move')return;drag=true;pts=[pos(e)];ov.setPointerCapture(e.pointerId);if(tool=='keep'||tool=='erase'){pushU();stroke(pts[0],pts[0]);render()}};
ov.onpointermove=e=>{if(!drag)return;const q=pts[pts.length-1],p=pos(e);pts.push(p);
 if(tool=='keep'||tool=='erase'){stroke(q,p);sched()}else{ox.clearRect(0,0,W,H);ox.beginPath();pts.forEach((a,i)=>i?ox.lineTo(...a):ox.moveTo(...a));ox.closePath();ox.strokeStyle='#4f8cff';ox.lineWidth=W/250;ox.setLineDash([W/60,W/120]);ox.stroke()}};
ov.onpointerup=async()=>{if(!drag)return;drag=false;ox.clearRect(0,0,W,H);if(tool=='keep'||tool=='erase'||pts.length<3)return;
 pushU();hasMask=true;const path=()=>{mx.beginPath();pts.forEach((a,i)=>i?mx.lineTo(...a):mx.moveTo(...a));mx.closePath()};
 if(tool=='lai'){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),pw=(Math.max(...xs)-Math.min(...xs))*.2,ph=(Math.max(...ys)-Math.min(...ys))*.2;
  const x=Math.max(0,Math.min(...xs)-pw),y=Math.max(0,Math.min(...ys)-ph),w=Math.min(W,Math.max(...xs)+pw)-x,h=Math.min(H,Math.max(...ys)+ph)-y;
  const t=mk(Math.round(w),Math.round(h));t.getContext('2d').drawImage(src,x,y,w,h,0,0,t.width,t.height);
  try{const bm=await cutBlob(t);mx.save();path();mx.clip();mx.clearRect(x,y,w,h);mx.drawImage(bm,x,y,w,h);mx.restore();st('Đã nhận dạng lại vùng khoanh.')}catch(e){st('Lỗi: '+e.message)}}
 else{mx.save();path();mx.clip();if(tool=='lkeep'){mx.fillStyle='#fff';mx.fillRect(0,0,W,H)}else mx.clearRect(0,0,W,H);mx.restore()}
 render()};
function setRatio(){const v=$('#rt').value;crop.on=!!v;if(!v){updBox();return}
 crop.r=v=='o'?W/H:v.split('/').reduce((a,b)=>a/b);crop.k=100;$('#zm').value=100;updBox()}
const cw=()=>Math.min(W,H*crop.r)*crop.k/100;
function updBox(){if(!crop.on||!W){box.style.display='none';return}const w=cw(),h=w/crop.r;
 crop.cx=Math.max(w/2,Math.min(W-w/2,crop.cx));crop.cy=Math.max(h/2,Math.min(H-h/2,crop.cy));
 Object.assign(box.style,{display:'block',left:(crop.cx-w/2)/W*100+'%',top:(crop.cy-h/2)/H*100+'%',width:w/W*100+'%',height:h/H*100+'%'})}
$('#rt').onchange=setRatio;$('#zm').oninput=e=>{crop.k=+e.target.value;updBox()};
$('#stage').addEventListener('wheel',e=>{if(!crop.on)return;e.preventDefault();crop.k=Math.max(10,Math.min(100,crop.k*(e.deltaY>0?.95:1.05)));$('#zm').value=crop.k;updBox()},{passive:false});
let bd=null;box.onpointerdown=e=>{bd=[e.clientX,e.clientY];box.setPointerCapture(e.pointerId)};
box.onpointermove=e=>{if(!bd)return;const r=cv.getBoundingClientRect();crop.cx+=(e.clientX-bd[0])*W/r.width;crop.cy+=(e.clientY-bd[1])*H/r.height;bd=[e.clientX,e.clientY];updBox()};
box.onpointerup=()=>bd=null;
function dl(){if(!src)return;render();const jpg=$('#fmt').value=='jpg';let w=W,h=H,sx=0,sy=0;
 if(crop.on){w=cw();h=w/crop.r;sx=crop.cx-w/2;sy=crop.cy-h/2}
 const o=mk(Math.round(w),Math.round(h)),c=o.getContext('2d');if(jpg){c.fillStyle='#fff';c.fillRect(0,0,o.width,o.height)}
 c.drawImage(cv,sx,sy,w,h,0,0,o.width,o.height);
 o.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='anh-chan-dung.'+(jpg?'jpg':'png');a.click()},jpg?'image/jpeg':'image/png',.95)}
async function up(){if(!src)return;if(Math.max(W,H)*2>4096){st('Ảnh đã đủ lớn (x2 sẽ vượt 4096px). Hãy dùng ảnh nhỏ hơn.');return}
 try{st('Đang tải mô hình AI…');const m=$('#um').value=='s'?'slim':'medium';
  const [U,M]=await Promise.all([import('https://esm.sh/upscaler@1.0.0'),import(`https://esm.sh/@upscalerjs/esrgan-${m}@1.0.0/2x`)]);
  const u=new U.default({model:M.default});
  const url=await u.upscale(src.toDataURL('image/jpeg',.95),{patchSize:64,padding:4,progress:p=>st('AI đang xử lý… '+Math.round(p*100)+'%')});
  const im=new Image();im.src=url;await im.decode();
  const ow=W;W=im.naturalWidth;H=im.naturalHeight;const k=W/ow;src=mk(W,H);src.getContext('2d').drawImage(im,0,0);
  const old=mask,hm=hasMask;newMask(false);mx.imageSmoothingQuality='high';mx.drawImage(old,0,0,W,H);hasMask=hm;undo=[];
  cv.width=ov.width=W;cv.height=ov.height=H;crop.cx*=k;crop.cy*=k;dirty=true;fit();render();st('Đã tăng độ phân giải: '+W+'×'+H+'px.')}
 catch(e){st('Lỗi AI: '+e.message)}}
</script></body></html>
